<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="bcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bcCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="bcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0A0D14" stroke="#1A2333" stroke-width="1.5"/>

  <!-- Matrix Grid Background Pattern -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="0.8">
    <line x1="20" y1="30" x2="700" y2="30" />
    <line x1="20" y1="60" x2="700" y2="60" />
    <line x1="20" y1="90" x2="700" y2="90" />
    <line x1="120" y1="10" x2="120" y2="110" />
    <line x1="240" y1="10" x2="240" y2="110" />
    <line x1="360" y1="10" x2="360" y2="110" />
    <line x1="480" y1="10" x2="480" y2="110" />
    <line x1="600" y1="10" x2="600" y2="110" />
  </g>

  <!-- High-Tech Operator Console Glyph -->
  <g transform="translate(36, 22)">
    <!-- Outer Octagonal Ring -->
    <polygon points="38,8 68,8 76,16 76,60 68,68 38,68 30,60 30,16" fill="#0F172A" stroke="url(#bcGrad)" stroke-width="2" />
    
    <!-- Embedded Terminal Screen -->
    <rect x="36" y="16" width="34" height="44" rx="4" fill="#070A10" stroke="#334155" stroke-width="1.2" />
    <line x1="40" y1="23" x2="48" y2="23" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="29" x2="64" y2="29" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    <line x1="40" y1="35" x2="58" y2="35" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    <line x1="40" y1="41" x2="52" y2="41" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Autonomous Agent Orbit Node -->
    <circle cx="20" cy="38" r="6" fill="#3B82F6" filter="url(#bcGlow)" />
    <circle cx="20" cy="38" r="3" fill="#FFFFFF" />
    <line x1="26" y1="38" x2="36" y2="38" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" />

    <circle cx="86" cy="38" r="6" fill="#8B5CF6" filter="url(#bcGlow)" />
    <circle cx="86" cy="38" r="3" fill="#FFFFFF" />
    <line x1="70" y1="38" x2="80" y2="38" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Brand Typography -->
  <text x="148" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#F8FAFC">BOSS<tspan fill="url(#bcGrad)">CONSOLE</tspan></text>
  <text x="150" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.2" fill="#94A3B8">NATIVE MULTI-THREADED OPERATOR CONSOLE FOR AI AGENTS</text>

  <!-- Status Pill -->
  <g transform="translate(515, 42)">
    <rect width="175" height="34" rx="17" fill="#0F172A" stroke="#253347" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#10B981" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.8">JVM • 100+ MCP TOOLS</text>
  </g>
</svg>